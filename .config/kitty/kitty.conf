wayland_enable_ime yes

font_family      CaskaydiaCove NF
bold_font        auto
italic_font      auto
bold_italic_font auto

map kitty_mod+ä next_window
map kitty_mod+ö previous_window

enabled_layouts fat, stack, tall

cursor_trail 100
background_opacity 0.75
transparent_background_colors #080A0C@0.75 #222426@0.75

foreground #dddddd
background #080A0C

